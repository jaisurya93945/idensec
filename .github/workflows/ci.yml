name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the signature gate can walk every commit on the
          # branch, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # The library itself has no runtime dependencies; only the dev tools
        # are installed here, and that is deliberate.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Confirm the library imports with no third-party packages
        run: |
          python - <<'PY'
          import subprocess, sys, json
          out = subprocess.run([sys.executable, "-c",
              "import idensec, sys, pathlib;"
              "std = {m for m in sys.stdlib_module_names};"
              "extra = sorted(n for n, m in sys.modules.items()"
              " if '.' not in n and n not in std and not n.startswith('_')"
              " and getattr(m, '__file__', '') and 'site-packages' in (m.__file__ or ''));"
              "print(json.dumps(extra))"],
              capture_output=True, text=True, check=True)
          extra = json.loads(out.stdout)
          if extra:
              sys.exit(f"idensec pulled in third-party modules: {extra}")
          print("clean: no third-party imports")
          PY

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Doctests
        run: python -c "import doctest, idensec, sys; sys.exit(bool(doctest.testmod(idensec).failed))"

      - name: Contract derivation has no dangerous misses
        # A dangerous miss is an authority-bearing parameter drafted as
        # something weaker: a silent hole if a reviewer skims past it.
        run: |
          python benchmarks/contract_derivation.py --json derivation.json
          python - <<'PY'
          import json, sys
          data = json.load(open("derivation.json"))
          if data["dangerous_misses"]:
              sys.exit(f"dangerous misses: {data['dangerous_misses']}")
          if data["authority_recall"] < 1.0:
              sys.exit(f"authority recall {data['authority_recall']:.0%} below 100%")
          print("authority recall 100%, no dangerous misses")
          PY

      - name: Contract linter is clean on shipped examples
        # Dogfooding: if our own contracts do not pass, nobody else's will.
        # Every contract file we ship, not just the first one written -- the
        # git corpus was added after this step existed and would have been
        # silently unchecked.
        run: |
          python -m idensec.lint examples/mcp/filesystem-contracts.json
          python -m idensec.lint examples/mcp/git-contracts.json
          python -m idensec.lint examples/mcp/memory-contracts.json

      - name: Example runs
        run: python examples/summarise_and_mail.py

      - name: End-to-end against a real MCP server
        # Drives the proxy in front of an unmodified
        # @modelcontextprotocol/server-filesystem under a real injection. Fails
        # if the strict labelling ever admits an injected call.
        run: python examples/mcp/attack_filesystem.py

      - name: Reference binding against a real MCP server
        # server-memory, a graph keyed by entity name, with the injection in an
        # observation. Fails if an injected delete gets through, or if the
        # narrow labelling cannot do the ordinary work.
        run: python examples/mcp/attack_memory.py

      - name: A coding agent on a repository it did not write
        # mcp-server-git under a source-comment injection whose goal is
        # exfiltration by commit. Scored on the proxy's VERDICT, not on what
        # ended up staged: an earlier version scored the effect and passed a
        # configuration that git's own .gitignore had rescued.
        run: |
          python -m pip install --upgrade uv
          python examples/mcp/attack_git.py

      - name: Benchmarks run
        run: python benchmarks/bench_monitor.py --quick

      - name: Contract drafting survives real MCP schemas
        # Replays tools/list captured from seven published servers. It runs
        # offline from the checked-in corpus, and exists because every defect
        # it has ever found was invisible to a corpus we wrote ourselves.
        run: |
          python benchmarks/mcp_corpus.py --json mcp.json
          python - <<'PY'
          import json, sys
          data = json.load(open("mcp.json"))
          if data["totals"]["tools"] < 40:
              sys.exit("corpus shrank; a capture probably failed")
          spurious = data["lint"].get("unknown-operand-kind", 0)
          if spurious:
              sys.exit(f"{spurious} parameters reported as unregistered kinds")
          claims = data["annotations"].get("readOnlyHint=True", 0)
          print(f"{data['totals']['tools']} tools drafted; "
                f"{claims} claim readOnlyHint, none believed")
          PY

      - name: Sealing is lossless on real MCP output
        # Replays 23 responses captured from six published servers. Exits
        # non-zero if resolving a sealed result fails to reproduce the
        # original -- the one property the read boundary must never break.
        run: |
          python benchmarks/mcp_output.py --json sealing.json
          python - <<'PY'
          import json, sys
          data = json.load(open("sealing.json"))
          if data["fidelity_failures"]:
              sys.exit(f"sealing damaged output: {data['fidelity_failures']}")
          git = data["servers"]["git"]
          density = git["sealed_chars"] / git["chars"]
          # 1.1% today. Before the hostname allowlist it was 6.6% on this same
          # corpus, because every dotted identifier in a diff was sealed, so
          # this threshold discriminates by a factor of three either way.
          if density > 0.02:
              sys.exit(f"sealing density on source diffs rose to {density:.1%}")
          print(f"lossless; git output {density:.1%} sealed")
          PY

      - name: A grant's surface is what we say it is
        # The preview reports what authoritative_paths would admit. If it ever
        # disagrees with the enforcer it is worse than nothing, so the unit
        # tests check agreement and this checks the published numbers: the
        # blanket grant admits essentially everything, the scoped one a small
        # set, the kind-scoped one nothing at all on this server.
        run: |
          python benchmarks/grant_surface.py --json surface.json
          python - <<'PY'
          import json, sys
          data = json.load(open("surface.json"))
          rows = {r["shape"]: r["floors"]["3"] for r in data["shapes"]}
          blanket = rows["blanket"]["admitted"] / rows["blanket"]["candidates"]
          scoped = rows["tool-scoped"]["admitted"] / rows["tool-scoped"]["candidates"]
          if blanket < 0.90:
              sys.exit(f"blanket grant surface fell to {blanket:.0%}; recheck U08")
          if scoped > 0.20:
              sys.exit(f"tool-scoped grant admits {scoped:.0%}; scoping stopped working")
          if rows["kind-scoped"]["admitted"]:
              sys.exit("kind-scoped grant is no longer inert; the finding changed")
          if not rows["tool-scoped"]["bare_words"]:
              sys.exit("an unclassified grant no longer admits prose; recheck the claim")
          print(f"blanket {blanket:.0%}, tool-scoped {scoped:.0%}, kind-scoped inert")
          PY

      - name: URL composition refuses what it is supposed to
        # Six cases over the egress destination. Exits non-zero if any attack
        # is admitted, or if the legitimate post stops working -- both halves
        # matter, since a mechanism that only denies is an outage.
        run: |
          python benchmarks/url_composition.py --json url.json
          python - <<'PY'
          import json, sys
          data = json.load(open("url.json"))
          by_depth = {row["depth"]: row["results"] for row in data["depths"]}
          wrong = [r["case"] for r in by_depth["url"] if not r["correct"]]
          if wrong:
              sys.exit(f"compose_urls got these wrong: {wrong}")
          off = {r["case"]: r for r in by_depth["off"]}
          legit = [r for r in by_depth["url"] if r["legitimate"]]
          if not legit or any(off[r["case"]]["admitted"] for r in legit):
              sys.exit("the legitimate case no longer needs composition; "
                       "the experiment has stopped measuring anything")
          leak = next(r for r in by_depth["url"]
                      if r["case"] == "exfiltration by path segment")
          if "confidential_egress" not in leak["findings"]:
              sys.exit("the path-segment leak is no longer caught by the "
                       "confidential-egress rule; principal_directed regressed")
          print(f"{len(by_depth['url'])} cases, all correct")
          PY

      - name: Extraction coverage does not regress
        # Coverage is a security parameter; a pattern change that silently
        # drops recall should fail the build, not surface months later.
        run: |
          python benchmarks/extraction_coverage.py --json coverage.json
          python - <<'PY'
          import json, sys
          data = json.load(open("coverage.json"))
          floor = 0.90
          if data["recall"] < floor:
              sys.exit(f"extraction recall {data['recall']:.0%} below floor {floor:.0%}")
          if data["false_positive_samples"] > 0:
              sys.exit(f"{data['false_positive_samples']} false positives on prose")
          print(f"recall {data['recall']:.0%}, no false positives")
          PY

  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every commit is signed by a pinned key
        # Standard library only, by design: a check on the integrity of the
        # repository should not depend on code fetched from an index.
        run: python tools/verify_commits.py
