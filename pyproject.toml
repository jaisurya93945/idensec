[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idensec"
version = "0.1.0"
description = "Deterministic argument-provenance enforcement for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "ai-agents", "security", "prompt-injection", "authorization",
    "information-flow-control", "provenance", "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Intentionally empty. A security component in the data path should not drag a
# dependency tree behind it -- see ADR-0006.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/jaisurya93945/idensec"
Source = "https://github.com/jaisurya93945/idensec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = [
    "S101",  # assert: the test suite is built on it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# The fuzzer needs *reproducible* randomness, which is exactly what S311 warns
# against using. A fixed seed is the feature: it makes a failure re-runnable
# from the test name alone. No key material is generated here.
"tests/test_fuzz.py" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
packages = ["idensec"]
mypy_path = "src"
strict = true
warn_unreachable = true
